# Test configuration for original Noxim at 3M cycles with TRAFFIC_RANDOM
# Testing to confirm base simulator has deadlock at 3M cycles

mesh_dim_x: 4
mesh_dim_y: 4
buffer_depth: 32
flit_size: 32
r2h_link_length: 2.0
r2r_link_length: 1.0
n_virtual_channels: 8

routing_algorithm: XY
routing_table_filename: ""
dyad_threshold: 0.6
selection_strategy: RANDOM

Hubs:
    defaults:
        rx_radio_channels: [0]
        tx_radio_channels: [0]
        attached_nodes: []
        to_tile_buffer_size: 4
        from_tile_buffer_size: 4
        rx_buffer_size: 4
        tx_buffer_size: 4
    0:
      attached_nodes: [0,1,4,5]
    1:
      attached_nodes: [2,3,6,7]
    2:
      attached_nodes: [8,9,12,13]
    3:
      attached_nodes: [10,11,14,15]

RadioChannels:
    defaults:
        data_rate: 16
        ber: [0, 0]
        mac_policy: [TOKEN_PACKET]

clock_period_ps: 1000
reset_time: 1000
simulation_time: 6000000
stats_warm_up_time: 1000
detailed: false
max_volume_to_be_drained: 0
show_buffer_stats: false

use_winoc: false
use_wirxsleep: false

verbose_mode: VERBOSE_OFF

trace_mode: false
trace_filename: ""

min_packet_size: 8
max_packet_size: 8
packet_injection_rate: 0.01
probability_of_retransmission: 0.05

traffic_distribution: TRAFFIC_RANDOM
traffic_table_filename: "t.txt"
traffic_hardcoded_filename: "t.txt"
