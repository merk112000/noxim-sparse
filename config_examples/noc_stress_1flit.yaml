# NoC Stress Test: 1-flit packets
# Test if smaller packets can achieve higher utilization

topology: MESH
mesh_dim_x: 5
mesh_dim_y: 5
buffer_depth: 64
flit_size: 256
r2h_link_length: 2.0
r2r_link_length: 1.0
n_virtual_channels: 8

routing_algorithm: XY
routing_table_filename: ""
dyad_threshold: 0.6
selection_strategy: RANDOM

use_winoc: false
use_wirxsleep: false

clock_period_ps: 600
reset_time: 1000
simulation_time: 50000
stats_warm_up_time: 5000
detailed: false
max_volume_to_be_drained: 0
show_buffer_stats: false

verbose_mode: VERBOSE_OFF
trace_mode: false
trace_filename: ""

# 2-flit packets (minimum allowed)
min_packet_size: 2
max_packet_size: 2

# Inject every other cycle (PIR=1.0, retrans=0.0)
packet_injection_rate: 1.0
probability_of_retransmission: 0.0

traffic_distribution: TRAFFIC_RANDOM
traffic_table_filename: ""
traffic_hardcoded_filename: ""
