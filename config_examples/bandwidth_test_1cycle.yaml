# Bandwidth test: 4-flit packets injected every cycle
# Expected: 100% link utilization for INTERVAL=1, bottleneck at 50% for INTERVAL=2

topology: MESH
mesh_dim_x: 5
mesh_dim_y: 5
buffer_depth: 64
flit_size: 256
r2h_link_length: 2.0
r2r_link_length: 1.0
n_virtual_channels: 8

routing_algorithm: XY
routing_table_filename: ""
dyad_threshold: 0.6
selection_strategy: RANDOM

# No wireless
use_winoc: false
use_wirxsleep: false

# SIMULATION PARAMETERS
clock_period_ps: 600
reset_time: 1000
simulation_time: 100000
stats_warm_up_time: 10000
detailed: false
max_volume_to_be_drained: 0
show_buffer_stats: false

verbose_mode: VERBOSE_OFF
trace_mode: false
trace_filename: ""

# TRAFFIC PATTERN: 4-flit packets
min_packet_size: 4
max_packet_size: 4

# Inject 1 packet every cycle = 1.0 packets/cycle
# At 4 flits/packet, this is 4 flits/cycle = 100% utilization
packet_injection_rate: 1.0

probability_of_retransmission: 0.0

# Use TRAFFIC_RANDOM for simple all-to-all traffic
traffic_distribution: TRAFFIC_RANDOM
traffic_table_filename: ""
traffic_hardcoded_filename: ""
